# Docker Compose — LeaveOS Local Development
# Brings up backend, frontend, and PostgreSQL with one command

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaveos
      POSTGRES_USER: leaveos
      POSTGRES_PASSWORD: leaveos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://leaveos:leaveos@db:5432/leaveos
      JWT_SECRET_KEY: docker-dev-secret-change-in-production
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_demo.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
